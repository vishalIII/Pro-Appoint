name: Deploy to EC2

on:
  push:
    branches: [deploy]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          DEPLOY_REF: ${{ github.ref_name }}
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${EC2_HOST:-}" ] || [ -z "${EC2_USERNAME:-}" ] || [ -z "${SSH_PRIVATE_KEY:-}" ]; then
            echo "Missing one of the required secrets: EC2_HOST, EC2_USERNAME, EC2_SSH_KEY"
            exit 1
          fi

          SSH_PORT="${EC2_PORT:-22}"
          REMOTE_DEPLOY_REF="${DEPLOY_REF:-main}"

          echo "$SSH_PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem

          echo "Checking SSH connectivity to ${EC2_HOST}:${SSH_PORT}..."
          if ! timeout 15 bash -c "cat < /dev/null > /dev/tcp/${EC2_HOST}/${SSH_PORT}"; then
            echo "Cannot reach ${EC2_HOST}:${SSH_PORT} from the GitHub runner."
            echo "Check the EC2 public IP/DNS, security group inbound rules, subnet routing, and server firewall."
            exit 1
          fi

          ssh -T -p "${SSH_PORT}" -i private_key.pem \
          -o StrictHostKeyChecking=no \
          -o ConnectTimeout=20 \
          ${EC2_USERNAME}@${EC2_HOST} "DEPLOY_REF='${REMOTE_DEPLOY_REF}' bash -s" << 'EOF'

          set -e

          echo "🚀 Starting deployment..."
          echo "📌 Deploy ref: ${DEPLOY_REF}"

          # ---------------------------
          # 1. Ensure repo exists safely
          # ---------------------------
          if [ ! -d "$HOME/Pro-Appoint/.git" ]; then
            echo "📥 Cloning repository..."
            git clone https://github.com/vishalIII/Pro-Appoint.git $HOME/Pro-Appoint
          fi

          cd $HOME/Pro-Appoint/backend

          # ---------------------------
          # 2. Sync latest code safely
          # ---------------------------
          echo "📥 Updating code..."
          git fetch origin "${DEPLOY_REF}"
          git reset --hard "origin/${DEPLOY_REF}"
          git clean -fd -e .env -e logs
          git log -1 --oneline

          if [ ! -s .env ]; then
            echo "Missing or empty backend/.env on the server."
            echo "Restore backend/.env with the production environment variables before deploying."
            ls -la
            exit 1
          fi

          echo "📄 Backend CORS source:"
          sed -n '1,35p' src/app.js
          sed -n '1,80p' src/config/cors.js

          # ---------------------------
          # 3. Install dependencies
          # ---------------------------
          echo "📦 Installing dependencies..."
          npm install --production

          # ---------------------------
          # 4. PM2 deployment (FIXED)
          # ---------------------------
          echo "♻️ Restarting PM2..."
          mkdir -p logs

          echo "📊 PM2 before cleanup:"
          pm2 list || true

          # Remove both the legacy app name and the current ecosystem app name.
          pm2 delete backend || true
          pm2 delete mern-backend || true
          pm2 start ecosystem.config.cjs --update-env

          pm2 save

          echo "🩺 Health check:"
          HEALTH_OK=""
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:5000/health; then
              HEALTH_OK="yes"
              break
            fi

            echo "Health check attempt ${attempt}/20 failed, waiting..."
            sleep 2
          done

          if [ -z "${HEALTH_OK}" ]; then
            echo "Backend never became healthy on 127.0.0.1:5000"
            pm2 logs mern-backend --lines 80 --nostream || true
            exit 1
          fi

          echo "🧪 CORS check:"
          CORS_RESPONSE=$(curl -si \
            -H "Origin: http://proappoint.s3-website.ap-south-1.amazonaws.com" \
            http://127.0.0.1:5000/api/shops | tr -d '\r')
          echo "${CORS_RESPONSE}" | sed -n '1,20p'

          CORS_HEADER=$(echo "${CORS_RESPONSE}" | grep -i '^Access-Control-Allow-Origin:' || true)

          if ! echo "${CORS_HEADER}" | grep -q "http://proappoint.s3-website.ap-south-1.amazonaws.com"; then
            echo "CORS verification failed on the backend."
            pm2 logs mern-backend --lines 40 --nostream || true
            exit 1
          fi

          echo "📊 PM2 Status:"
          pm2 list

          echo "✅ Deployment completed successfully!"

          EOF

          rm private_key.pem
