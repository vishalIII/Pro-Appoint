name: Deploy to EC2

on:
  push:
    branches: [deploy]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "$SSH_PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem

          ssh -i private_key.pem -o StrictHostKeyChecking=no \
          ${EC2_USERNAME}@${EC2_HOST} << 'EOF'

          set -e

          echo "🚀 Starting deployment..."

          # ---------------------------
          # 1. Ensure repo exists safely
          # ---------------------------
          if [ ! -d "$HOME/Pro-Appoint/.git" ]; then
            echo "📥 Cloning repository..."
            git clone https://github.com/vishalIII/Pro-Appoint.git $HOME/Pro-Appoint
          fi

          cd $HOME/Pro-Appoint/backend

          # ---------------------------
          # 2. Sync latest code safely
          # ---------------------------
          echo "📥 Updating code..."
          git fetch origin main
          git reset --hard origin/main
          git clean -fd

          # ---------------------------
          # 3. Install dependencies
          # ---------------------------
          echo "📦 Installing dependencies..."
          npm install --production

          # ---------------------------
          # 4. PM2 deployment (FIXED)
          # ---------------------------
          echo "♻️ Restarting PM2..."

          # Always use ecosystem file (no name mismatch issues)
          pm2 start ecosystem.config.cjs --update-env || pm2 restart ecosystem.config.cjs

          pm2 save

          echo "📊 PM2 Status:"
          pm2 list

          echo "✅ Deployment completed successfully!"

          EOF

          rm private_key.pem