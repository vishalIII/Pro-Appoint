name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "$SSH_PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem

          ssh -i private_key.pem -o StrictHostKeyChecking=no \
          ${EC2_USERNAME}@${EC2_HOST} << 'EOF'

          set -e

          echo "🚀 Starting deployment..."

          # ---------------------------
          # 1. Ensure project exists
          # ---------------------------
          if [ ! -d "~/Pro-Appoint" ]; then
            echo "📥 Cloning repository..."
            git clone https://github.com/vishalIII/Pro-Appoint.git ~/Pro-Appoint
          fi

          cd ~/Pro-Appoint/backend

          # ---------------------------
          # 2. Fix repo state safely
          # ---------------------------
          echo "📥 Updating code..."
          git fetch origin main
          git reset --hard origin/main
          git clean -fd

          # ---------------------------
          # 3. Install dependencies
          # ---------------------------
          echo "📦 Installing dependencies..."
          npm install --production

          # ---------------------------
          # 4. PM2 deploy (safe)
          # ---------------------------
          echo "♻️ Restarting PM2..."

          if pm2 list | grep -q "backend"; then
            pm2 restart backend --update-env
          else
            pm2 start ecosystem.config.cjs --name backend
          fi

          pm2 save

          echo "📊 PM2 Status:"
          pm2 list

          echo "✅ Deployment completed successfully!"

          EOF

          rm private_key.pem