services:
  # backend:
  #   build: ./backend
  #   container_name: backend
  #   ports:
  #     - "5000:5000"
  #   env_file:
  #     - ./backend/.env
  #   depends_on:
  #     - mongo
  #   volumes:
  #     - ./backend:/app
  #     - /app/node_modules

  backend:
    build: ./backend
    container_name: backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    depends_on:
      - mongo
      - redis
    volumes:
      - ./backend:/app
    command: sh -c "npm install && npm run dev"
    dns:
      - 8.8.8.8
      - 8.8.4.4

  mongo:
    image: mongo:7
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # frontend:
  #   build: ./frontend
  #   container_name: frontend
  #   ports:
  #     - "5173:5173"
  #   depends_on:
  #     - backend
  #   volumes:
  #     - ./frontend:/app
  #     - frontend_node_modules:/app/node_modules

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      VITE_DEV_PROXY_TARGET: http://backend:5000
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host"

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  redis:
    image: redis:7



volumes:
  mongo_data:
  frontend_node_modules:
